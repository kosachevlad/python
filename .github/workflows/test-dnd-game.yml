name: Test D20 Tkinter game
on:
  push:
    branches: [examples/dnd-test-game]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare offline environment
        run: node android/prepare-web.cjs
      - name: Test game in mobile browser
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          node android/dnd-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D20-preview
          path: android/artifacts/
          retention-days: 30
